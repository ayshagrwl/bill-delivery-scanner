<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Bill Delivery</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 12px;
}

.header {
  background: #111827;
  color: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.header h1 {
  margin: 0;
  font-size: 21px;
}

.header p {
  margin: 5px 0 0;
  font-size: 12px;
  opacity: .7;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 12px;
  box-shadow:
    0 2px 10px rgba(0,0,0,.06);
}

#reader {
  width: 100%;
}

.bill {
  text-align: center;
}

.invoice {
  font-size: 14px;
  color: #6b7280;
  word-break: break-all;
}

.party {
  font-size: 23px;
  font-weight: bold;
  margin-top: 4px;
}

.amount {
  font-size: 30px;
  font-weight: bold;
  margin-top: 8px;
}

.status {
  display: inline-block;
  padding: 6px 11px;
  margin-top: 8px;
  border-radius: 20px;
  background: #e5e7eb;
  font-size: 12px;
  font-weight: bold;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 15px;
  margin-top: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.delivered {
  background: #16a34a;
  color: white;
}

.not-delivered {
  background: #f59e0b;
  color: white;
}

.returned {
  background: #dc2626;
  color: white;
}

.more {
  background: #111827;
  color: white;
}

.gray {
  background: #e5e7eb;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 16px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-top: 14px;
  margin-bottom: 6px;
}

textarea {
  min-height: 75px;
}

.hidden {
  display: none !important;
}

.message {
  padding: 11px;
  border-radius: 9px;
  margin-bottom: 10px;
  font-size: 14px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.info {
  background: #dbeafe;
  color: #1e40af;
}

.success {
  text-align: center;
}

.success-icon {
  font-size: 45px;
}

.loading {
  opacity: .6;
  pointer-events: none;
}

</style>

</head>


<body>

<div class="container">


<div class="header">

<h1>Bill Delivery</h1>

<p>
Scan → Deliver → Next
</p>

</div>


<div id="message"></div>


<!-- ===========================
     CAMERA
=========================== -->

<div id="scannerCard"
     class="card">

<div id="reader"></div>

</div>


<!-- ===========================
     BILL
=========================== -->

<div id="billCard"
     class="card bill hidden">

<div class="invoice"
     id="invoice">
</div>

<div class="party"
     id="party">
</div>

<div class="amount"
     id="amount">
</div>

<div class="status"
     id="status">
</div>

</div>


<!-- ===========================
     FAST ACTION
=========================== -->

<div id="actionCard"
     class="card hidden">


<!-- NORMAL DELIVERY -->

<button
  class="delivered"
  id="deliveredBtn"
  onclick="quickDelivered()">

✓ DELIVERED

</button>


<!-- OTHER OPTIONS -->

<button
  class="more"
  onclick="showMoreOptions()">

More Options

</button>


</div>


<!-- ===========================
     MORE OPTIONS
=========================== -->

<div id="moreCard"
     class="card hidden">

<h3>
Other Actions
</h3>


<button
  class="not-delivered"
  onclick="openForm('Not Delivered')">

Not Delivered

</button>


<button
  class="returned"
  onclick="openForm('Returned')">

Returned

</button>


<button
  class="more"
  onclick="openForm('Delivered Payment')">

Delivered + Payment Collected

</button>


<button
  class="gray"
  onclick="hideMoreOptions()">

Back

</button>

</div>


<!-- ===========================
     FORM
=========================== -->

<div id="formCard"
     class="card hidden">

<h3 id="formTitle">
Details
</h3>


<div id="paymentSection">

<label>
Paid Amount
</label>

<input
  id="paid"
  type="number"
  min="0"
  step="0.01"
  placeholder="Enter amount collected">


<label>
Payment Mode
</label>

<select id="payment">

<option value="">
Select
</option>

<option value="Cash">
Cash
</option>

<option value="UPI">
UPI
</option>

<option value="Cheque">
Cheque
</option>

<option value="Bank">
Bank
</option>

</select>

</div>


<div id="returnSection">

<label>
Return Type
</label>

<select id="returnType">

<option value="">
No Return
</option>

<option value="Full Bill">
Full Bill
</option>

<option value="Partial Product Return">
Partial Product Return
</option>

</select>


<label>
Return Amount
</label>

<input
  id="returnAmount"
  type="number"
  min="0"
  step="0.01">


</div>


<div id="reasonSection">

<label>
Reason
</label>

<select id="reason">

<option value="">
Select Reason
</option>

<option value="Shop Closed">
Shop Closed
</option>

<option value="Party Not Available">
Party Not Available
</option>

<option value="Refused">
Refused
</option>

<option value="Wrong Address">
Wrong Address
</option>

<option value="Product Return">
Product Return
</option>

<option value="Damaged Product">
Damaged Product
</option>

<option value="Other">
Other
</option>

</select>

</div>


<label>
Remark
</label>

<textarea
  id="remark"
  placeholder="Optional">
</textarea>


<button
  id="submitBtn"
  class="more"
  onclick="submitForm()">

Save

</button>


<button
  class="gray"
  onclick="cancelForm()">

Cancel

</button>

</div>


<!-- ===========================
     SUCCESS
=========================== -->

<div id="successCard"
     class="card success hidden">

<div class="success-icon">
✓
</div>

<h3>
Saved
</h3>

<div id="successText">
</div>

</div>


</div>


<script>


// ======================================================
// PUT YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxArY34EngwVG37ZyP-2XEsmigJc1-SwKfc7s7_VVWoJ6CZMuklCAc-fRV_u1K4gBlN/exec";


// ======================================================
// VARIABLES
// ======================================================

let scanner = null;

let scannerRunning = false;

let currentBill = null;

let selectedStatus = null;

let lastScannedText = '';

let lastScanTime = 0;


// ======================================================
// START SCANNER
// ======================================================

function startScanner() {

  if (scannerRunning)
    return;


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner
    .start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      {
        fps: 15,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      qrSuccess,

      function() {}

    )

    .then(function() {

      scannerRunning = true;

    })

    .catch(function(error) {

      showError(
        "Camera could not start. " +
        error
      );

    });

}


// ======================================================
// QR SUCCESS
// ======================================================

function qrSuccess(text) {

  if (!text)
    return;


  const now =
    Date.now();


  /*
    Prevent the same QR from
    being processed repeatedly
    while it remains in front
    of the camera.
  */

  if (
    text === lastScannedText &&
    now - lastScanTime < 2000
  ) {

    return;

  }


  lastScannedText =
    text;

  lastScanTime =
    now;


  if (navigator.vibrate) {

    navigator.vibrate(60);

  }


  processQR(text);

}


// ======================================================
// PROCESS QR
// ======================================================

function processQR(qr) {

  showInfo(
    "Reading bill..."
  );


  /*
    Temporarily hide scanner
    visually while processing.

    We DO NOT stop the camera.
  */

  document
    .getElementById(
      "scannerCard"
    )
    .classList.add(
      "hidden"
    );


  jsonp(

    API_URL +
    "?action=scan&qr=" +
    encodeURIComponent(qr),

    function(result) {

      if (!result.success) {

        document
          .getElementById(
            "scannerCard"
          )
          .classList.remove(
            "hidden"
          );

        showError(
          result.error
        );

        return;

      }


      currentBill =
        result;


      clearMessage();

      showBill(result);

    }

  );

}


// ======================================================
// SHOW BILL
// ======================================================

function showBill(bill) {

  document
    .getElementById("invoice")
    .innerText =
      bill.invoiceNo;


  document
    .getElementById("party")
    .innerText =
      bill.partyName;


  document
    .getElementById("amount")
    .innerText =
      "₹" +
      Number(
        bill.amount
      ).toLocaleString(
        "en-IN",
        {
          minimumFractionDigits: 2
        }
      );


  document
    .getElementById("status")
    .innerText =
      "Status: " +
      bill.status;


  document
    .getElementById("billCard")
    .classList.remove(
      "hidden"
    );


  document
    .getElementById("actionCard")
    .classList.remove(
      "hidden"
    );


  /*
    If it is already delivered,
    still allow editing through
    More Options.
  */

}


// ======================================================
// QUICK DELIVERED
// ======================================================

function quickDelivered() {

  if (!currentBill)
    return;


  const button =
    document.getElementById(
      "deliveredBtn"
    );


  button.disabled =
    true;


  button.innerText =
    "Saving...";


  saveAction({

    invoiceNo:
      currentBill.invoiceNo,

    status:
      "Delivered",

    paidAmount:
      "",

    paymentMode:
      "",

    returnType:
      "",

    returnAmount:
      "",

    reason:
      "",

    remark:
      ""

  });

}


// ======================================================
// MORE OPTIONS
// ======================================================

function showMoreOptions() {

  document
    .getElementById(
      "moreCard"
    )
    .classList.remove(
      "hidden"
    );

}


function hideMoreOptions() {

  document
    .getElementById(
      "moreCard"
    )
    .classList.add(
      "hidden"
    );

}


// ======================================================
// OPEN FORM
// ======================================================

function openForm(type) {

  selectedStatus =
    type;


  document
    .getElementById(
      "moreCard"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "formCard"
    )
    .classList.remove(
      "hidden"
    );


  const payment =
    document.getElementById(
      "paymentSection"
    );


  const returns =
    document.getElementById(
      "returnSection"
    );


  const reason =
    document.getElementById(
      "reasonSection"
    );


  /*
    Delivered + payment
  */

  if (
    type ===
    "Delivered Payment"
  ) {

    selectedStatus =
      "Delivered";

    payment.classList.remove(
      "hidden"
    );

    returns.classList.add(
      "hidden"
    );

    reason.classList.add(
      "hidden"
    );


    document
      .getElementById(
        "formTitle"
      )
      .innerText =
      "Payment Collected";

    return;

  }


  /*
    Not delivered
  */

  if (
    type ===
    "Not Delivered"
  ) {

    payment.classList.add(
      "hidden"
    );

    returns.classList.add(
      "hidden"
    );

    reason.classList.remove(
      "hidden"
    );


    document
      .getElementById(
        "formTitle"
      )
      .innerText =
      "Not Delivered";

    return;

  }


  /*
    Returned
  */

  if (
    type ===
    "Returned"
  ) {

    payment.classList.add(
      "hidden"
    );

    returns.classList.remove(
      "hidden"
    );

    reason.classList.remove(
      "hidden"
    );


    document
      .getElementById(
        "formTitle"
      )
      .innerText =
      "Return";


    document
      .getElementById(
        "returnType"
      )
      .value =
      "Full Bill";


    document
      .getElementById(
        "returnAmount"
      )
      .value =
      currentBill.amount;

  }

}


// ======================================================
// SUBMIT FORM
// ======================================================

function submitForm() {

  const submit =
    document.getElementById(
      "submitBtn"
    );


  submit.disabled =
    true;

  submit.innerText =
    "Saving...";


  saveAction({

    invoiceNo:
      currentBill.invoiceNo,

    status:
      selectedStatus,

    paidAmount:
      document.getElementById(
        "paid"
      ).value,

    paymentMode:
      document.getElementById(
        "payment"
      ).value,

    returnType:
      document.getElementById(
        "returnType"
      ).value,

    returnAmount:
      document.getElementById(
        "returnAmount"
      ).value,

    reason:
      document.getElementById(
        "reason"
      ).value,

    remark:
      document.getElementById(
        "remark"
      ).value.trim()

  });

}


// ======================================================
// SAVE ACTION
// ======================================================

function saveAction(data) {

  const params =

    "?action=update" +

    "&invoiceNo=" +
    encodeURIComponent(
      data.invoiceNo
    ) +

    "&status=" +
    encodeURIComponent(
      data.status
    ) +

    "&paidAmount=" +
    encodeURIComponent(
      data.paidAmount
    ) +

    "&paymentMode=" +
    encodeURIComponent(
      data.paymentMode
    ) +

    "&returnType=" +
    encodeURIComponent(
      data.returnType
    ) +

    "&returnAmount=" +
    encodeURIComponent(
      data.returnAmount
    ) +

    "&reason=" +
    encodeURIComponent(
      data.reason
    ) +

    "&remark=" +
    encodeURIComponent(
      data.remark
    );


  jsonp(

    API_URL + params,

    function(result) {

      if (!result.success) {

        showError(
          result.error
        );

        resetBillScreen();

        return;

      }


      /*
        Normal delivery:
        show tiny confirmation
        and immediately return
        to scanner.
      */

      showSuccess(
        result.invoiceNo +
        " • " +
        result.status
      );


      setTimeout(
        function() {

          resetBillScreen();

          prepareNextScan();

        },
        500
      );

    }

  );

}


// ======================================================
// PREPARE NEXT SCAN
// ======================================================

function prepareNextScan() {

  clearMessage();


  /*
    Make scanner visible again.
  */

  document
    .getElementById(
      "scannerCard"
    )
    .classList.remove(
      "hidden"
    );


  /*
    Clear duplicate protection
    after a short delay.
  */

  setTimeout(
    function() {

      lastScannedText =
        '';

    },
    800
  );

}


// ======================================================
// RESET BILL SCREEN
// ======================================================

function resetBillScreen() {

  currentBill =
    null;

  selectedStatus =
    null;


  document
    .getElementById(
      "billCard"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "actionCard"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "moreCard"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "formCard"
    )
    .classList.add(
      "hidden"
    );


  /*
    Clear inputs.
  */

  document
    .getElementById(
      "paid"
    )
    .value = '';


  document
    .getElementById(
      "payment"
    )
    .value = '';


  document
    .getElementById(
      "returnType"
    )
    .value = '';


  document
    .getElementById(
      "returnAmount"
    )
    .value = '';


  document
    .getElementById(
      "reason"
    )
    .value = '';


  document
    .getElementById(
      "remark"
    )
    .value = '';

}


// ======================================================
// SUCCESS
// ======================================================

function showSuccess(text) {

  document
    .getElementById(
      "message"
    )
    .innerHTML =

    '<div class="message info">' +
    '✓ ' +
    text +
    '</div>';

}


// ======================================================
// ERRORS
// ======================================================

function showError(text) {

  document
    .getElementById(
      "message"
    )
    .innerHTML =

    '<div class="message error">' +
    text +
    '</div>';

}


function showInfo(text) {

  document
    .getElementById(
      "message"
    )
    .innerHTML =

    '<div class="message info">' +
    text +
    '</div>';

}


function clearMessage() {

  document
    .getElementById(
      "message"
    )
    .innerHTML = '';

}


// ======================================================
// JSONP
// ======================================================

function jsonp(
  url,
  callback
) {

  const callbackName =
    'cb_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  window[callbackName] =
    function(data) {

      delete window[
        callbackName
      ];

      script.remove();

      callback(data);

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    url +
    '&callback=' +
    callbackName;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      script.remove();

      showError(
        'Unable to connect to Google Sheets.'
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


// ======================================================
// START
// ======================================================

window.onload =
  function() {

    startScanner();

  };

</script>

</body>

</html>
